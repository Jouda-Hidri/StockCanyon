server.port=${SERVER_PORT:8099}

# --- Market data ----------------------------------------------------------
# The service is off unless enabled, so the container that plays the exchange can
# run the same image with only the simulator switched on.
marketdata.enabled=${MARKETDATA_ENABLED:true}

# The Stock Exchange feed. ?checkpoint_timestamp= is appended by the client.
marketdata.exchange-url=${MARKETDATA_EXCHANGE_URL:ws://localhost:8099/exchange/quotes}

marketdata.database.url=${MARKETDATA_DB_URL:jdbc:postgresql://localhost:5432/marketdata}
marketdata.database.username=${MARKETDATA_DB_USER:marketdata}
marketdata.database.password=${MARKETDATA_DB_PASSWORD:marketdata}

marketdata.consumption.max-batch-size=2000
# The latency-versus-throughput dial: bounds how stale the latest quote can be,
# and how many quotes one commit gets to amortise.
marketdata.consumption.flush-interval=200ms
# Must exceed the exchange's heartbeat interval, or a quiet market is mistaken
# for a dead socket and reconnected every time trading slows down.
marketdata.consumption.stall-timeout=15s

# The stand-in exchange. Not part of the service -- enabled on the instance that
# plays the exchange, which under Compose is a second container from one image.
marketdata.simulator.enabled=${MARKETDATA_SIMULATOR_ENABLED:false}
marketdata.simulator.quotes-per-second=${MARKETDATA_SIMULATOR_QPS:200}
marketdata.simulator.retained-quotes=500000
# Zipf exponent. At 1.1 the busiest instrument gets ~100x the quietest, which is
# the uneven arrival rate the coalescing write path exists to handle.
marketdata.simulator.skew=1.1

# Flyway is driven explicitly against the market data pool in MarketDataConfig,
# so the auto-configuration must not also try to run against it.
spring.flyway.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
