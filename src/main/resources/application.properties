server.port=${SERVER_PORT:8099}
# Finish in-flight API requests on SIGTERM rather than cutting them off mid-response.
server.shutdown=graceful

# --- Roles -------------------------------------------------------------------
# One jar, three roles. A deployment switches on exactly one per process; a local
# run may switch on all three. Each service owns its datastore and never reads the
# other's: consumption -> PostgreSQL, distribution -> Redis, joined by the outbox,
# Debezium and a Kafka topic.
marketdata.consumption.enabled=${MARKETDATA_CONSUMPTION_ENABLED:true}
marketdata.distribution.enabled=${MARKETDATA_DISTRIBUTION_ENABLED:true}

# --- Consumption service ------------------------------------------------------
# The Stock Exchange feed. ?checkpoint_timestamp= is appended by the client.
marketdata.exchange-url=${MARKETDATA_EXCHANGE_URL:ws://localhost:8099/exchange/quotes}

marketdata.database.url=${MARKETDATA_DB_URL:jdbc:postgresql://localhost:5432/marketdata}
marketdata.database.username=${MARKETDATA_DB_USER:marketdata}
marketdata.database.password=${MARKETDATA_DB_PASSWORD:marketdata}

marketdata.consumption.max-batch-size=2000
# The latency-versus-throughput dial: bounds how stale the latest quote can be,
# and how many quotes one commit gets to amortise.
marketdata.consumption.flush-interval=200ms
# The bounded buffer between socket and writer. At the high watermark the socket
# closes and the exchange holds the backlog; it reopens once the writer has drained
# to the low watermark. Capacity above high absorbs frames already in flight.
marketdata.consumption.queue-capacity=50000
marketdata.consumption.queue-high-watermark=40000
marketdata.consumption.queue-low-watermark=10000
# Must exceed the exchange's heartbeat interval, or a quiet market is mistaken
# for a dead socket and reconnected every time trading slows down.
marketdata.consumption.stall-timeout=15s
# Exponential backoff with jitter between reconnect attempts.
marketdata.consumption.reconnect-initial-delay=500ms
marketdata.consumption.reconnect-max-delay=30s
# Exponential backoff with jitter between attempts at a failed transaction. The
# batch is retried until it commits; it is never dropped.
marketdata.consumption.write-retry-initial-delay=100ms
marketdata.consumption.write-retry-max-delay=10s
# A sequence hole open this long forces a replay from the checkpoint; after this
# many replays that do not fill it, it is written off and counted as lost.
marketdata.consumption.gap-backfill-after=2s
marketdata.consumption.gap-max-backfills=3
marketdata.consumption.shutdown-drain-timeout=10s
# Write nothing until Debezium's slot exists: an outbox event committed before it is
# never published. Off only where no connector runs (tests of ingestion alone).
marketdata.consumption.require-cdc-slot=${MARKETDATA_REQUIRE_CDC_SLOT:true}
marketdata.consumption.cdc-slot=marketdata_outbox

# Leader election for ingestion. Failover takes about one TTL after the leader dies.
marketdata.leadership.lock-ttl=10s

# --- Distribution service -----------------------------------------------------
# The compacted topic Debezium's Outbox Event Router publishes latest quotes to,
# keyed by ISIN.
marketdata.distribution.topic=marketdata.latest-quote
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=marketdata-distribution
# The consumer's position lives in Redis, written with the prices it covers; Kafka's
# committed offsets are for lag monitoring only. With no position in Redis (new, wiped,
# or lost in a failover) it reads the compacted topic from the start.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=1000
spring.kafka.listener.ack-mode=batch
# Never let this consumer create the topic. Subscribing to a topic that does not exist
# yet would otherwise auto-create it with the broker's defaults -- cleanup.policy=delete
# -- before the connector creates it compacted, and a delete-policy topic loses the
# latest quote of any instrument that stops trading for longer than its retention.
spring.kafka.consumer.properties.allow.auto.create.topics=false
# Redis: host/port locally and in Compose. On Kubernetes the Sentinel settings are
# given instead (SPRING_DATA_REDIS_SENTINEL_MASTER / _NODES), and the client
# follows failover to whichever node Sentinel names as master.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# The stand-in exchange. Not part of the service -- enabled on the instance that
# plays the exchange, which under Compose is a second container from one image.
marketdata.simulator.enabled=${MARKETDATA_SIMULATOR_ENABLED:false}
marketdata.simulator.quotes-per-second=${MARKETDATA_SIMULATOR_QPS:200}
marketdata.simulator.retained-quotes=500000
# Zipf exponent. At 1.1 the busiest instrument gets ~100x the quietest, which is
# the uneven arrival rate the coalescing write path exists to handle.
marketdata.simulator.skew=1.1

# Flyway is driven explicitly against the market data pool in ConsumptionConfig,
# so the auto-configuration must not also try to run against it.
spring.flyway.enabled=false

# --- Monitoring -------------------------------------------------------------
# outboxreseed exists only on the consumption service: POST re-publishes every latest
# quote, to rebuild the distribution side after a lost slot or topic.
management.endpoints.web.exposure.include=health,info,prometheus,metrics,outboxreseed
management.endpoint.health.show-details=always
# /actuator/health/liveness and /readiness for Kubernetes and Compose. Ingestion
# health is reported by /actuator/health only: see IngestionHealthIndicator.
management.endpoint.health.probes.enabled=true
# Each role reports only its own datastore: a consumption pod must not go DOWN
# because it has no Redis, which it never uses.
management.health.redis.enabled=${marketdata.distribution.enabled}
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
# API request rate, latency and errors: histogram buckets so Prometheus can compute
# percentiles across instances, which pre-computed per-instance percentiles cannot.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.tags.application=marketdata
