# Fly.io deployment for the market data service.
#
#   fly launch --no-deploy --copy-config --name <your-app>
#   fly postgres create --name <your-app>-db
#   fly postgres attach <your-app>-db          # sets DATABASE_URL
#   fly secrets set MARKETDATA_DB_URL="jdbc:postgresql://<host>:5432/<db>" \
#                   MARKETDATA_DB_USER=... MARKETDATA_DB_PASSWORD=...
#   fly deploy
#
# Fly's `fly postgres attach` writes DATABASE_URL in libpq form
# (postgres://user:pass@host:5432/db), which the PostgreSQL JDBC driver does not accept.
# Rather than parse it at start-up — a conversion that silently does the wrong thing the
# first time a password contains a reserved character — the three JDBC settings are given
# explicitly from the values `attach` prints.
#
# The simulated exchange and the consumer run in the same machine here, which is the
# difference from the Compose setup: Compose separates them so the connection between
# them is a real network hop that can be severed to demonstrate recovery. A single
# machine is the cheaper shape for a deployment whose job is to be reachable.

app = "stockcanyon"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  SERVER_PORT = "8099"
  MARKETDATA_ENABLED = "true"
  MARKETDATA_SIMULATOR_ENABLED = "true"
  MARKETDATA_SIMULATOR_QPS = "100"
  MARKETDATA_EXCHANGE_URL = "ws://localhost:8099/exchange/quotes"

[http_service]
  internal_port = 8099
  force_https = true
  # Never scaled to zero. Ingestion is the point of the service: a machine that stops
  # when nobody is calling the API is a machine that is not consuming the feed, and every
  # suspension becomes an outage the checkpoint then has to recover from.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "180s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/actuator/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2
