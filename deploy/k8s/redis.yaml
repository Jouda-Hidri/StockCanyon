# The distribution service's database: one hash per instrument, its latest quote. Run by the
# OpsTree redis-operator (redis.redis.opstreelabs.in/v1beta2): three Redis nodes with replication,
# and three Sentinels that promote a replica if the master dies.
#
# The client finds the master through Sentinel (Service `marketdata-redis-sentinel`, master group
# `myMaster`, the operator's default), so a failover needs no change on the application side.
#
# Durability matters less than availability here: everything in Redis can be rebuilt by replaying
# the compacted marketdata.latest-quote topic from the start.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisReplication
metadata:
  name: marketdata-redis
spec:
  clusterSize: 3
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.4.11
    imagePullPolicy: IfNotPresent
    resources:
      requests: { cpu: 250m, memory: 512Mi }
      limits: { memory: 512Mi }
  redisExporter:
    enabled: true
    image: quay.io/opstree/redis-exporter:latest
  storage:
    volumeClaimTemplate:
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: marketdata-redis
spec:
  clusterSize: 3
  podSecurityContext:
    runAsUser: 1000
    fsGroup: 1000
  pdb:
    enabled: true
    minAvailable: 2
  redisSentinelConfig:
    redisReplicationName: marketdata-redis
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v7.4.11
    imagePullPolicy: IfNotPresent
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 128Mi }
