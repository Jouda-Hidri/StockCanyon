# The OpsTree redis-operator from its own manifests: image pinned (upstream leaves it untagged) and
# allowed to be pulled (upstream sets imagePullPolicy: Never, a local-development setting).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - github.com/OT-CONTAINER-KIT/redis-operator/config/default?ref=v0.26.0
images:
  - name: quay.io/opstree/redis-operator
    newTag: v0.26.0
patches:
  - target: { kind: Deployment, name: redis-operator-redis-operator }
    patch: |-
      - { op: replace, path: /spec/template/spec/containers/0/imagePullPolicy, value: IfNotPresent }
