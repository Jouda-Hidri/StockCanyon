# The distribution service: consumes marketdata.latest-quote into its own Redis and serves the API
# from it. Stateless itself, behind a Service, scaled on CPU. It has no database credentials at
# all: one datastore per service.
#
# Every pod is also a member of the Kafka consumer group, so the topic's 12 partitions spread
# across up to 12 pods; pods beyond that serve reads only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketdata-distribution
  labels:
    app.kubernetes.io/name: marketdata
    app.kubernetes.io/component: distribution
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: marketdata
      app.kubernetes.io/component: distribution
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketdata
        app.kubernetes.io/component: distribution
    spec:
      automountServiceAccountToken: false
      # preStop 5s + graceful HTTP shutdown (≤20s, spring.lifecycle.timeout-per-shutdown-phase) < 30s.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: marketdata
              app.kubernetes.io/component: distribution
      containers:
        - name: marketdata
          image: stockcanyon
          env:
            - name: SERVER_PORT
              value: "8099"
            - name: MARKETDATA_CONSUMPTION_ENABLED
              value: "false"
            - name: MARKETDATA_DISTRIBUTION_ENABLED
              value: "true"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: marketdata-kafka-kafka-bootstrap:9092
            # Through Sentinel, so a Redis failover moves the client to the new master on its own.
            - name: SPRING_DATA_REDIS_SENTINEL_MASTER
              value: myMaster
            - name: SPRING_DATA_REDIS_SENTINEL_NODES
              value: marketdata-redis-sentinel:26379
          ports:
            - name: http
              containerPort: 8099
          lifecycle:
            # Give the endpoints controller time to stop routing here before the server stops
            # accepting; without it a rollout drops a few requests on the floor.
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: marketdata-distribution
spec:
  selector:
    app.kubernetes.io/name: marketdata
    app.kubernetes.io/component: distribution
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: marketdata-distribution
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: marketdata-distribution
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: marketdata-distribution
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: marketdata
      app.kubernetes.io/component: distribution
